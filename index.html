function visible(){let q=$('#search').value.trim().toLowerCase();let arr=rows.filter(r=>(filter==='all'||filter==='near'||r.type===filter)&&(r.name+' '+r.address).toLowerCase().includes(q));if(filter==='near'){if(!user)return[];arr=arr.filter(r=>r.lat&&r.lng&&meters([r.lat,r.lng],user)<1300)}if(user)arr.sort((a,b)=>(a.lat?meters([a.lat,a.lng],user):1e10)-(b.lat?meters([b.lat,b.lng],user):1e10));return arr}
function render(){let a=visible();$('#count').innerHTML='<strong>'+a.length+'곳</strong>의 화장실'+(filter==='near'?' · 내 위치 반경 1.3km':'');$('#results').innerHTML=a.length?a.map(r=>'<article class="place '+(selected===r.id?'selected':'')+'" data-id="'+r.id+'"><div class="type">'+(r.type==='public'?'공중화장실':'개방화장실')+'</div><h3>'+escapeHtml(r.name)+'</h3><p>'+escapeHtml(r.address)+'</p><div class="foot"><span class="smalltag">변기 수 '+escapeHtml(r.stalls||'정보 없음')+'</span><span class="smalltag">'+escapeHtml(r.hours||'운영시간 확인 필요')+'</span><span class="smalltag">'+(r.lat&&r.lng?'지도 위치 있음':'위치 확인 중')+'</span></div></article>').join(''):'<div class="empty">검색 결과가 없습니다.'+(filter==='near'?' 내 위치를 허용하고 좌표가 있는 시설을 확인해 주세요.':'')+'</div>';document.querySelectorAll('.place').forEach(el=>el.onclick=()=>openDetail(rows[Number(el.dataset.id)],'list'));showMarkers()}
function detailMarkup(r){return '<div class="type">'+(r.type==='public'?'공중화장실':'개방화장실')+'</div><h2>'+escapeHtml(r.name)+'</h2><p>'+escapeHtml(r.address)+'</p><p>변기 수 '+escapeHtml(r.stalls??'정보 없음')+' · '+escapeHtml(r.hours||'운영시간 미확인')+'</p><div class="actions"><a target="_blank" rel="noopener" href="https://map.naver.com/p/search/'+encodeURIComponent(r.address)+'">네이버 지도에서 확인 ↗</a></div>'+(r.lat&&r.lng?'':'<p style="color:#b45309">지도 좌표가 없어 위치를 이동할 수 없습니다.</p>')}
function onMobile(){return window.matchMedia('(max-width:750px)').matches}
function moveIfOutside(r){if(!map||!r.lat||!r.lng)return;const target=new naver.maps.LatLng(r.lat,r.lng);const bounds=map.getBounds();if(bounds&&bounds.hasLatLng(target))return; // Already visible: do not move or zoom.
  // panTo animates rather than abruptly jumping; preserve the current zoom.
  map.panTo(target,{duration:550,easing:'easeOutCubic'});
}
function openDetail(r,source='list'){
 selected=r.id;render();const html=detailMarkup(r);
 if(onMobile()){
   document.body.classList.remove('desktop-detail');$('#detailbody').innerHTML=html;$('#detail').style.display='block';document.body.classList.add('detail-open');
 }else{
   $('#detail').style.display='none';document.body.classList.remove('detail-open');document.body.classList.add('desktop-detail');$('#sideDetailBody').innerHTML=html;
   // Keep search controls for search-origin selection; the detail replaces the results area.
 }
 moveIfOutside(r);
}
function drawUser(){if(!map||!user)return;if(userMarker)userMarker.setMap(null);userMarker=new naver.maps.Marker({position:new naver.maps.LatLng(...user),map,icon:{content:'<div style="width:19px;height:19px;border:4px solid white;border-radius:50%;background:#237cfa;box-shadow:0 0 0 8px #2b7cf633,0 2px 9px #0004"></div>',anchor:new naver.maps.Point(10,10)}});map.panTo(new naver.maps.LatLng(...user));map.setZoom(15)}
$('#locate').onclick=()=>{if(!navigator.geolocation){alert('위치 서비스를 지원하지 않는 브라우저입니다.');return}navigator.geolocation.getCurrentPosition(p=>{user=[p.coords.latitude,p.coords.longitude];drawUser();render()},()=>alert('현재 위치를 확인하지 못했습니다. 위치 권한 및 HTTPS 접속을 확인해 주세요.'),{enableHighAccuracy:true,timeout:12000})};$('#home').onclick=()=>{if(map){map.panTo(new naver.maps.LatLng(37.5535,126.922));map.setZoom(14)}};function closeDetail(){ $('#detail').style.display='none';document.body.classList.remove('detail-open','desktop-detail');selected=null;render();if(map)naver.maps.Event.trigger(map,'resize') }
$('#close').onclick=closeDetail;$('#detailBack').onclick=closeDetail;$('#sideBack').onclick=closeDetail;
$('#retry').onclick=()=>location.reload();$('#search').addEventListener('input',()=>{if(selected!==null)closeDetail();else render()});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));if(filter==='near'&&!user)$('#locate').click();if(selected!==null)closeDetail();else render()});
// 개발자용: 좌표 CSV를 같은 폴더에 두면 자동 로드. 사용자에게 업로드 버튼 노출하지 않음.
async function loadCoordinates(){try{let res=await fetch('./toilets_coordinates.csv?ver=2',{cache:'no-store'});if(!res.ok)return;let text=await res.text();let parsed=parseCSV(text);if(parsed.length){let index=new Map(parsed.map(r=>[r.restroom_id||r.address,r]));rows.forEach(r=>{let x=index.get('MP'+String(r.id+1).padStart(3,'0'))||index.get(r.address);if(x){let lat=Number(x.lat),lng=Number(x.lng);if(lat>33&&lat<39&&lng>124&&lng<132){r.lat=lat;r.lng=lng}}});render()}}catch(e){}}
function parseCSV(str){let table=[],row=[],v='',quoted=false;for(let i=0;i<str.length;i++){let c=str[i];if(c==='"'){if(quoted&&str[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&str[i+1]==='\n')i++;row.push(v);if(row.length>1)table.push(row);row=[];v=''}else v+=c}if(row.length||v){row.push(v);table.push(row)}let keys=(table.shift()||[]).map(x=>x.replace(/^\uFEFF/,''));return table.map(a=>Object.fromEntries(keys.map((k,i)=>[k,a[i]||''])))}
render();loadMap();loadCoordinates();</script></body></html>
